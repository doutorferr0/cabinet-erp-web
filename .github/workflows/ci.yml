name: CI

on:
  push:
    branches: [main, 'design/2.0']
  pull_request:
    # Reface 2.0 (2026-09-02): as 30 PRs da rodada miram design/2.0 ou uma branch
    # design/d*-… em cadeia — sem isto nenhuma delas tinha CI.
    branches: [main, 'design/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm ANTES do setup-node, e a ordem é requisito: o `cache: pnpm` do passo
      # seguinte roda `pnpm store path`, que não existe sem o pnpm instalado.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      # `cache: pnpm` explícito continua valendo. O que o setup-node v6 restringiu
      # foi o cache AUTOMÁTICO por `packageManager` no package.json (que este repo
      # não declara) — a entrada explícita não mudou.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O cliente gerado é commitado. Se alguém atualizar o contrato e esquecer
      # o codegen (ou editar o gerado à mão), o front compila contra tipos velhos
      # e a divergência só aparece em runtime. Como o contrato é DESTE repo e muda
      # por PR daqui, esta é a guarda inteira da fronteira: gerado ⇔ contracts/.
      - name: Codegen is up to date
        run: |
          pnpm codegen
          git diff --exit-code -- src/api/gerado \
            || { echo '::error::src/api/gerado está fora de sincronia com contracts/openapi-v1.json — rode `pnpm codegen` e commite.'; exit 1; }

      # O DESIGN.md publica NÚMERO de contraste e o `.impeccable/design.json` copia
      # os tokens. Os dois já mentiram: a leva Polaris trocou 12 valores no CSS e
      # a página seguiu descrevendo a fase 1.6 por cinco dias, com três assentos
      # lendo aquilo como lei. `--conferir` recalcula do CSS e reprova a divergência.
      - name: Design doc em dia (tokens e contraste)
        run: |
          python3 docs/design/medir-contraste.py --conferir \
            || { echo '::error::DESIGN.md fora de sincronia com src/index.css — rode `python3 docs/design/medir-contraste.py --escrever` e confira o frontmatter.'; exit 1; }

      # A medição de algarismo tabular existia e NINGUÉM a rodava — só valia para
      # quem a chamasse à mão. Foi assim que a Bebas Neue, quinta família trazida
      # pela fusão v5 r3, ficou dois dias fora da conta: a saída do script
      # continuava bonita, só que menor, e nada reprovava. Aqui ele passa a
      # reprovar família importada no `src/index.css` que a lista não cobre.
      #
      # Depende do `Install dependencies` acima: a medição lê o WOFF de dentro de
      # `node_modules/@fontsource`, que é o arquivo que o navegador vai baixar.
      - name: Toda família importada é medida
        run: |
          python3 docs/design/medir-tabular.py \
            || { echo '::error::família @fontsource fora de docs/design/medir-tabular.py — acrescente-a a FAMILIAS com o papel dela, ou tire o @import de src/index.css.'; exit 1; }

      - name: Lint and format check
        run: pnpm exec biome ci .

      - name: Fronteira de dados (tela não chama o cliente gerado)
        shell: bash
        run: |
          set -euo pipefail
          violacoes="$(
            rg -n -U -P '^[[:space:]]*import(?![[:space:]]+type\b)[^;]*?(?:\bfrom[[:space:]]+)?(?:\x27|")@/api/gerado(?:\x27|")' \
              src --glob '*.ts' --glob '*.tsx' || true
          )"
          violacoes="$(printf '%s\n' "$violacoes" | grep -Ev '^src/(data|api|mocks/api)/' | sed '/^$/d' || true)"
          if [ -n "$violacoes" ]; then
            printf '%s\n' "$violacoes"
            echo '::error::import de valor de @/api/gerado fora da fronteira de dados — a tela pede data.<recurso>.'
            exit 1
          fi

      - name: Testes de rota usam os helpers de src/test
        shell: bash
        run: |
          set -euo pipefail
          violacoes="$(rg -l 'createMemoryHistory' src --glob '*.ts' --glob '*.tsx' || true)"
          violacoes="$(printf '%s\n' "$violacoes" | grep -v '^src/test/' | sed '/^$/d' || true)"
          if [ -n "$violacoes" ]; then
            printf '%s\n' "$violacoes"
            echo '::error::teste de rota cria history local — use renderRoute/renderWithQuery de src/test/utils.tsx.'
            exit 1
          fi

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # ─────────────────────────────────────────────────────────────────────────────
  # O PAR VIVO — Postgres de verdade, api de verdade, navegador de verdade.
  #
  # Este job existe porque duas baterias deste repositório NUNCA rodaram:
  # `src/mocks/ao-vivo.test.ts` nasceu `describe.skipIf(!CABINET_AO_VIVO)` e o
  # E2E não existia. A razão gravada no arquivo era honesta — *"o CI não tem
  # Postgres, e teste que precisa de infra externa vira teste vermelho por
  # ambiente"* — e o preço dela foi medido na #341: das 46 rotas declaradas como
  # não-servidas em 22/08, **27 eram falsas 48h depois e nada avisou**. Teste
  # desligado por padrão não fica vermelho: fica quieto.
  #
  # O obstáculo real nunca foi o Postgres — era o `cabinet-erp-api` ser PRIVADO.
  # Este repositório é público, e repositório público não recebe segredo em PR de
  # fork: um checkout cross-repo por deploy key nasceria vermelho e insalvável.
  # O api passou a público em 25/08 (api#220), e daí o `actions/checkout` abaixo
  # não precisar de token nenhum.
  ao-vivo:
    runs-on: ubuntu-latest
    services:
      postgres:
        # A MESMA imagem do `docker-compose.yml` do api. Divergir aqui faria o CI
        # medir um Postgres que ninguém roda.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabinet
        ports: ['5432:5432']
        # Sem healthcheck o job segue com o banco ainda subindo e a migração
        # falha com `ECONNREFUSED`, que não se parece nada com o problema.
        options: >-
          --health-cmd "pg_isready -U postgres -d cabinet"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # As TRÊS identidades do api, e a separação é a garantia de isolamento —
      # não organização de arquivo. Superusuário só no passo de bootstrap; dono
      # do schema só na migração; runtime (sem BYPASSRLS) serve request.
      DATABASE_URL_SUPERUSUARIO: postgres://postgres:postgres@localhost:5432/cabinet
      DATABASE_URL_MIGRACAO: postgres://cabinet_owner:cabinet_owner@localhost:5432/cabinet
      DATABASE_URL: postgres://cabinet_runtime:cabinet_runtime@localhost:5432/cabinet
      SESSION_SECRET: segredo-de-ci-com-mais-de-32-caracteres
      CABINET_API_DIR: ${{ github.workspace }}/api
      CABINET_API_PORT: '3000'
      CABINET_APP_PORT: '5173'
      CABINET_BACKEND: http://localhost:3000
      CABINET_APP: http://localhost:5173
      # O workflow sobe o par; a suíte do Playwright reaproveita em vez de tentar
      # subir um segundo Vite na mesma porta.
      CABINET_PAR_EXTERNO: '1'
    steps:
      - uses: actions/checkout@v7

      # O api é PÚBLICO desde a api#220: checkout cross-repo sem segredo. A `main`
      # de propósito, e não um sha fixo — o valor deste job é justamente pegar a
      # divergência no dia em que ela nasce. Fixar o ref mediria o backend de
      # ontem e daria verde para um par que já não existe.
      - name: Checkout do cabinet-erp-api
        uses: actions/checkout@v7
        with:
          repository: doutorferr0/cabinet-erp-api
          ref: main
          path: api

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      # Node 24, e não o 22 dos outros jobs: o api roda TypeScript direto e
      # declara `engines.node >= 24`. O Vite 8 e a suíte deste repo rodam nos
      # dois, então 24 é o denominador que serve aos dois checkouts.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (web)
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (api)
        run: pnpm install --frozen-lockfile
        working-directory: api

      # O comando ÚNICO de semeadura: bootstrap de superusuário (papel dono +
      # `unaccent`) + migrações + papel de runtime + semente. O primeiro passo
      # existe porque *service container do Actions não monta volume* — em dev
      # quem entrega o `preparar-banco.sql` é o `docker-entrypoint-initdb.d` do
      # compose, e aqui não há initdb. Sem ele a `0004` falha alto criando
      # `sem_acento()`.
      - name: Semear o banco (setup:ci do api)
        run: pnpm par:semear

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Api e Vite sobem AQUI, e não dentro do Playwright, porque a mesma dupla
      # serve as duas baterias: o `ao-vivo` roda em Node e não teria como pedir a
      # Playwright que subisse nada.
      - name: Subir o par (api + Vite)
        run: |
          node --env-file-if-exists=.env api/src/main.ts > api.log 2>&1 &
          VITE_API_PROXY=http://localhost:3000 \
            pnpm exec vite --port 5173 --strictPort > vite.log 2>&1 &
          # Espera em bash, e não `npx wait-on`: este repo fixa
          # `minimumReleaseAge` justamente para não puxar pacote fresco do npm,
          # e um `npx --yes` no CI faria exatamente isso, toda execução.
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://localhost:3000/health \
              && curl -sf -o /dev/null http://localhost:5173/ \
              && echo "par de pé em ${i}s" && exit 0
            sleep 1
          done
          echo '::error::o par não subiu em 120s'
          tail -50 api.log vite.log || true
          exit 1

      # A FRONTEIRA: status, shape e quem respondeu cada rota — inclusive a
      # remedição da #341, que reprova a rota declarada como não-servida que
      # passou a ser servida.
      - name: Fronteira contra o backend real (ao-vivo)
        run: pnpm par:ao-vivo

      # A TELA: o que o `ao-vivo` não alcança rodando em Node. Um fluxo só,
      # encadeado, no navegador — login → parceiro → produto → orçamento →
      # pedido, com cada elo sendo um id que atravessou HTTP e RLS.
      - name: Fluxo vivo no navegador (E2E)
        run: pnpm e2e

      # Falhou? O motivo quase nunca está no log do Playwright: está no do api
      # (o 400 com o `detail` do contrato) ou no do Vite (proxy não montado).
      - name: Logs do par
        if: failure()
        run: |
          echo '::group::api'; tail -200 api.log || true; echo '::endgroup::'
          echo '::group::vite'; tail -100 vite.log || true; echo '::endgroup::'

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
