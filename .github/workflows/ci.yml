name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm ANTES do setup-node, e a ordem é requisito: o `cache: pnpm` do passo
      # seguinte roda `pnpm store path`, que não existe sem o pnpm instalado.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      # `cache: pnpm` explícito continua valendo. O que o setup-node v6 restringiu
      # foi o cache AUTOMÁTICO por `packageManager` no package.json (que este repo
      # não declara) — a entrada explícita não mudou.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # O cliente gerado é commitado. Se alguém atualizar o contrato e esquecer
      # o codegen (ou editar o gerado à mão), o front compila contra tipos velhos
      # e a divergência só aparece em runtime. Como o contrato é DESTE repo e muda
      # por PR daqui, esta é a guarda inteira da fronteira: gerado ⇔ contracts/.
      - name: Codegen is up to date
        run: |
          pnpm codegen
          git diff --exit-code -- src/api/gerado \
            || { echo '::error::src/api/gerado está fora de sincronia com contracts/openapi-v1.json — rode `pnpm codegen` e commite.'; exit 1; }

      - name: Lint and format check
        run: pnpm exec biome ci .

      - name: Fronteira de dados (tela não chama o cliente gerado)
        shell: bash
        run: |
          set -euo pipefail
          violacoes="$(
            rg -n -U -P '^[[:space:]]*import(?![[:space:]]+type\b)[^;]*?(?:\bfrom[[:space:]]+)?(?:\x27|")@/api/gerado(?:\x27|")' \
              src --glob '*.ts' --glob '*.tsx' || true
          )"
          violacoes="$(printf '%s\n' "$violacoes" | grep -Ev '^src/(data|api|mocks/api)/' | sed '/^$/d' || true)"
          if [ -n "$violacoes" ]; then
            printf '%s\n' "$violacoes"
            echo '::error::import de valor de @/api/gerado fora da fronteira de dados — a tela pede data.<recurso>.'
            exit 1
          fi

      - name: Testes de rota usam os helpers de src/test
        shell: bash
        run: |
          set -euo pipefail
          violacoes="$(rg -l 'createMemoryHistory' src --glob '*.ts' --glob '*.tsx' || true)"
          violacoes="$(printf '%s\n' "$violacoes" | grep -v '^src/test/' | sed '/^$/d' || true)"
          if [ -n "$violacoes" ]; then
            printf '%s\n' "$violacoes"
            echo '::error::teste de rota cria history local — use renderRoute/renderWithQuery de src/test/utils.tsx.'
            exit 1
          fi

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
