<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cabinet — Consulta por módulos (listagem + ficha)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111; --muted:#5C5A54; --faint:#8B887F;
    --bancada:#FAF6EE; --folha:#FFFFFF;
    --bw:2px;
    --sombra:4px 4px 0 #111; --sombra-sm:3px 3px 0 #111; --sombra-xs:2px 2px 0 #111; --sombra-lg:6px 6px 0 #111;
    --dinheiro:#16A34A; --foco:#FACC15; --erro:#DC2626;
    --main:#5551FF;
    --r:12px; --r-lg:16px; --r-sm:9px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Manrope',sans-serif;background:#EFE9DC;color:var(--ink);font-size:14px;padding:22px;min-height:100vh}
  h1,h2,h3,b,strong{font-family:'Archivo',sans-serif}
  .app{max-width:1240px;margin:0 auto;background:var(--bancada);border:var(--bw) solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:var(--sombra-lg)}

  .orn{display:inline-block;flex-shrink:0;background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:center;mask-position:center}
  .o1{-webkit-mask-image:url('assets-brutalist/brutalist/brutalist-001.svg');mask-image:url('assets-brutalist/brutalist/brutalist-001.svg')}
  .o2{-webkit-mask-image:url('assets-brutalist/brutalist/brutalist-014.svg');mask-image:url('assets-brutalist/brutalist/brutalist-014.svg')}
  .o3{-webkit-mask-image:url('assets-brutalist/brutalist-shape/brutalist-shape-101.svg');mask-image:url('assets-brutalist/brutalist-shape/brutalist-shape-101.svg')}
  .o4{-webkit-mask-image:url('assets-brutalist/brutalist-shape/brutalist-shape-120.svg');mask-image:url('assets-brutalist/brutalist-shape/brutalist-shape-120.svg')}
  .o5{-webkit-mask-image:url('assets-brutalist/spark/spark-001.svg');mask-image:url('assets-brutalist/spark/spark-001.svg')}
  .o6{-webkit-mask-image:url('assets-brutalist/spark/spark-020.svg');mask-image:url('assets-brutalist/spark/spark-020.svg')}
  .o7{-webkit-mask-image:url('assets-brutalist/brutalist/brutalist-072.svg');mask-image:url('assets-brutalist/brutalist/brutalist-072.svg')}
  .o8{-webkit-mask-image:url('assets-brutalist/brutalist-shape/brutalist-shape-140.svg');mask-image:url('assets-brutalist/brutalist-shape/brutalist-shape-140.svg')}
  .selo{width:40px;height:40px;border:var(--bw) solid var(--ink);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--folha)}
  .selo .orn{width:22px;height:22px}
  .selo.lg{width:48px;height:48px;border-radius:13px;box-shadow:var(--sombra-xs)}
  .selo.lg .orn{width:26px;height:26px;color:#fff}

  .seletor{display:flex;gap:9px;flex-wrap:wrap;padding:14px 24px;border-bottom:var(--bw) solid var(--ink);background:var(--bancada)}
  .ent{display:flex;align-items:center;gap:8px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--folha);padding:8px 14px;font-family:'Archivo';font-size:13px;font-weight:800;cursor:pointer;box-shadow:var(--sombra-xs)}
  .ent .pt{width:14px;height:14px;border:var(--bw) solid var(--ink);border-radius:5px}
  .ent:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 #111}
  .ent.on{color:#fff;box-shadow:var(--sombra-sm)}
  .ent.on .pt{background:#fff!important}

  /* ===== barra de comando ===== */
  .comando{background:var(--folha);border-bottom:var(--bw) solid var(--ink);padding:16px 24px}
  .cmd-linha{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .busca{flex:1;min-width:230px;display:flex;align-items:center;gap:10px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--folha);padding:11px 14px;box-shadow:var(--sombra-sm)}
  .busca input{border:0;outline:0;background:transparent;font-family:'Manrope';font-size:14px;font-weight:700;width:100%}
  .busca input::placeholder{color:var(--faint);font-weight:600}
  .btn{border:var(--bw) solid var(--ink);border-radius:var(--r);padding:11px 18px;font-family:'Archivo';font-size:13.5px;font-weight:900;cursor:pointer;box-shadow:var(--sombra-sm);background:var(--folha);display:flex;align-items:center;gap:8px}
  .btn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 #111}
  .btn.novo{color:#fff}

  .rotulo-faixa{font-size:10px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .modulos{display:flex;gap:8px;flex-wrap:wrap}
  .mod{display:flex;align-items:center;gap:7px;border:var(--bw) solid var(--ink);border-radius:var(--r-sm);background:var(--folha);padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:var(--sombra-xs)}
  .mod .pt{width:12px;height:12px;border:var(--bw) solid var(--ink);border-radius:4px}
  .mod .qt{font-family:'Archivo';font-size:10.5px;font-weight:900;border:1.5px solid var(--ink);border-radius:5px;padding:0 5px;background:var(--foco)}
  .mod:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 #111}
  .mod.on{box-shadow:inset 0 0 0 2px #111}

  .painel{display:none;border:var(--bw) solid var(--ink);border-radius:var(--r);margin-top:12px;box-shadow:var(--sombra-sm);overflow:hidden}
  .painel.aberto{display:block}
  .painel-topo{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:var(--bw) solid var(--ink);font-family:'Archivo';font-size:13px;font-weight:900}
  .painel-topo .x{margin-left:auto;border:var(--bw) solid var(--ink);border-radius:7px;background:var(--folha);font-family:'Archivo';font-size:11px;font-weight:900;padding:4px 9px;cursor:pointer}
  .painel-corpo{padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  label{display:block;font-size:10.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
  .entrada{width:100%;border:var(--bw) solid var(--ink);border-radius:var(--r-sm);background:var(--folha);padding:9px 11px;font-family:'Manrope';font-size:13px;font-weight:700;outline:0;box-shadow:var(--sombra-xs)}
  .entrada:focus{box-shadow:0 0 0 3px var(--foco),var(--sombra-xs)}
  select.entrada{appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23111' stroke-width='3.5'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
  .par-min{display:flex;gap:8px;align-items:center}
  .par-min .entrada{min-width:0}

  .ativos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{display:flex;align-items:center;gap:7px;border:var(--bw) solid var(--ink);border-radius:20px;padding:5px 6px 5px 11px;font-size:11.5px;font-weight:800;box-shadow:var(--sombra-xs)}
  .pill b{font-family:'Archivo'}
  .pill .x{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:50%;background:var(--folha);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;cursor:pointer;font-family:'Archivo'}
  .limpar{border:var(--bw) dashed var(--ink);border-radius:20px;background:transparent;padding:5px 12px;font-family:'Archivo';font-size:11.5px;font-weight:900;cursor:pointer}

  /* ===== resultado ===== */
  .resultado{padding:20px 24px 24px}
  .res-topo{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .res-topo .cont{font-family:'Archivo';font-size:15px;font-weight:900}
  .res-topo .cont small{font-family:'Manrope';font-size:12px;font-weight:800;color:var(--muted)}
  .mini{margin-left:auto;display:flex;gap:8px}
  .mini button{border:var(--bw) solid var(--ink);border-radius:var(--r-sm);background:var(--folha);padding:7px 12px;font-family:'Archivo';font-size:12px;font-weight:900;cursor:pointer;box-shadow:var(--sombra-xs)}
  .mini button:hover{background:var(--foco)}

  .grade{border:var(--bw) solid var(--ink);border-radius:var(--r-lg);overflow:hidden;background:var(--folha);box-shadow:var(--sombra)}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-family:'Archivo';font-size:10.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:11px 14px;border-bottom:var(--bw) solid var(--ink);white-space:nowrap}
  thead th .tp{display:inline-block;width:9px;height:9px;border:1.5px solid var(--ink);border-radius:3px;margin-right:6px;vertical-align:-1px}
  tbody td{padding:12px 14px;border-bottom:var(--bw) solid #E7E5E4;font-size:13px;font-weight:700;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--foco)}
  td.forte{font-family:'Archivo';font-weight:900;font-size:13.5px}
  td.grana{font-family:'Archivo';font-weight:900;color:var(--dinheiro)}
  .marca{display:inline-flex;align-items:center;gap:6px;border:var(--bw) solid var(--ink);border-radius:7px;padding:2px 8px;font-size:10.5px;font-weight:900;font-family:'Archivo'}
  .vazio-cel{color:var(--faint);font-weight:800}

  /* ===== FICHA ===== */
  .ficha-topo{background:var(--folha);border-bottom:var(--bw) solid var(--ink);padding:18px 24px}
  .voltar{border:var(--bw) solid var(--ink);border-radius:var(--r-sm);background:var(--folha);padding:6px 12px;font-family:'Archivo';font-size:12px;font-weight:900;cursor:pointer;box-shadow:var(--sombra-xs);margin-bottom:13px}
  .ficha-id{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .ficha-id h1{font-size:26px;font-weight:900;letter-spacing:-.6px}
  .ficha-id .sub{font-size:12.5px;font-weight:800;color:var(--muted);margin-top:2px}
  .acoes{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
  .kpi{border:var(--bw) solid var(--ink);border-radius:var(--r);padding:11px 13px;box-shadow:var(--sombra-xs)}
  .kpi .r{font-size:10px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:'Archivo';font-size:21px;font-weight:900;letter-spacing:-.5px;margin-top:3px}

  .ficha-corpo{padding:22px 24px 24px;display:flex;gap:22px;align-items:flex-start}
  .ficha-col{flex:1;min-width:0;max-width:820px}
  .ficha-lat{width:230px;flex-shrink:0;position:sticky;top:22px}

  .bloco{border:var(--bw) solid var(--ink);border-radius:var(--r-lg);margin-bottom:14px;box-shadow:var(--sombra);overflow:hidden;background:var(--folha)}
  .bl-topo{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer;user-select:none;border-bottom:var(--bw) solid transparent}
  .bloco.aberto .bl-topo{border-bottom-color:var(--ink)}
  .bl-txt h2{font-size:15.5px;font-weight:900;letter-spacing:-.3px}
  .bl-txt p{font-size:11px;font-weight:700;opacity:.75;margin-top:2px}
  .bl-dir{margin-left:auto;display:flex;align-items:center;gap:9px}
  .tag{font-size:10px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;border:var(--bw) solid var(--ink);border-radius:7px;padding:3px 8px;background:var(--folha)}
  .contador{font-family:'Archivo';font-size:11.5px;font-weight:900;border:var(--bw) solid var(--ink);border-radius:7px;padding:3px 9px;background:var(--dinheiro);color:#fff}
  .lapis{width:30px;height:30px;border:var(--bw) solid var(--ink);border-radius:var(--r-sm);background:var(--folha);display:flex;align-items:center;justify-content:center;box-shadow:var(--sombra-xs)}
  .lapis:hover{background:var(--foco)}
  .seta{width:30px;height:30px;border:var(--bw) solid var(--ink);border-radius:var(--r-sm);background:var(--folha);display:flex;align-items:center;justify-content:center;box-shadow:var(--sombra-xs);transition:transform .18s}
  .bloco.aberto .seta{transform:rotate(180deg)}
  .bl-corpo{display:none;padding:16px 18px 18px}
  .bloco.aberto .bl-corpo{display:block}
  .dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 18px}
  .dado .r{font-size:10px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
  .dado .v{font-size:14.5px;font-weight:800;margin-top:2px;word-break:break-word}
  .dado .v.vazio{color:var(--faint);font-weight:700;font-style:italic}
  .dado .v.grana{font-family:'Archivo';font-weight:900;color:var(--dinheiro)}

  /* bloco sem dado: apagado */
  .bloco.oco{box-shadow:none;border-color:#A8A29E;background:#F4F4F0}
  .bloco.oco .bl-topo{background:#F4F4F0!important}
  .bloco.oco .bl-txt h2{color:var(--muted)!important}
  .bloco.oco .bl-txt p{color:var(--faint)!important}
  .bloco.oco .selo{border-color:#A8A29E;background:#F4F4F0}
  .bloco.oco .selo .orn{color:#A8A29E!important}
  .bloco.oco .seta,.bloco.oco .lapis{border-color:#A8A29E;box-shadow:none}
  .btn-preencher{border:var(--bw) dashed var(--ink);border-radius:var(--r-sm);background:var(--folha);padding:5px 11px;font-family:'Archivo';font-size:11.5px;font-weight:900;cursor:pointer}
  .btn-preencher:hover{background:var(--foco)}

  .card-lat{border:var(--bw) solid var(--ink);border-radius:var(--r-lg);background:var(--folha);box-shadow:var(--sombra);overflow:hidden;margin-bottom:13px}
  .card-lat h3{font-size:11.5px;font-weight:900;letter-spacing:1px;text-transform:uppercase;padding:10px 13px;border-bottom:var(--bw) solid var(--ink);display:flex;align-items:center;gap:8px}
  .card-lat h3 .orn{width:14px;height:14px}
  .lista-nav{padding:7px}
  .item-nav{display:flex;align-items:center;gap:9px;padding:7px 9px;border:var(--bw) solid transparent;border-radius:var(--r-sm);font-size:12px;font-weight:800;cursor:pointer;margin-bottom:2px}
  .item-nav:hover{border-color:var(--ink);background:var(--bancada)}
  .item-nav .pt{width:12px;height:12px;border:var(--bw) solid var(--ink);border-radius:4px;flex-shrink:0}
  .item-nav .st{margin-left:auto;font-size:10px;font-weight:900;color:var(--muted)}
  .item-nav.oco{color:var(--faint)}
  .item-nav.oco .pt{background:#E7E5E4!important}

  .oculto{display:none!important}
  @media(max-width:1040px){.ficha-lat{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="seletor" id="seletor"></div>

  <!-- ================= LISTAGEM ================= -->
  <div id="telaLista">
    <div class="comando">
      <div class="cmd-linha">
        <div class="busca">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="buscaGeral" placeholder="Buscar…">
        </div>
        <button class="btn" onclick="alterna('colunas')">Colunas</button>
        <button class="btn novo" id="btnNovo">+ Novo</button>
      </div>

      <div class="rotulo-faixa"><i class="orn o6" style="width:13px;height:13px"></i> Filtrar por módulo</div>
      <div class="modulos" id="modulos"></div>

      <div class="painel" id="painelFiltro">
        <div class="painel-topo" id="painelTopo"></div>
        <div class="painel-corpo" id="painelCorpo"></div>
      </div>

      <div class="painel" id="painelColunas">
        <div class="painel-topo" style="background:#F4F4F0">Colunas visíveis — agrupadas por módulo
          <button class="x" onclick="alterna('colunas')">Fechar</button></div>
        <div class="painel-corpo" id="colunasCorpo"></div>
      </div>

      <div class="ativos" id="ativos"></div>
    </div>

    <div class="resultado">
      <div class="res-topo">
        <div class="cont" id="contRes"></div>
        <div class="mini">
          <button>Exportar</button><button>Imprimir</button><button>Etiquetas</button>
        </div>
      </div>
      <div class="grade"><table><thead id="cab"></thead><tbody id="linhas"></tbody></table></div>
    </div>
  </div>

  <!-- ================= FICHA ================= -->
  <div id="telaFicha" class="oculto">
    <div class="ficha-topo">
      <button class="voltar" onclick="voltar()">← Voltar para a listagem</button>
      <div class="ficha-id">
        <div class="selo lg" id="fSelo"></div>
        <div>
          <h1 id="fNome"></h1>
          <div class="sub" id="fSub"></div>
        </div>
        <div class="acoes">
          <button class="btn">Editar tudo</button>
          <button class="btn">Duplicar</button>
          <button class="btn" style="background:#FDE3E3">Inativar</button>
        </div>
      </div>
      <div class="kpis" id="fKpis"></div>
    </div>
    <div class="ficha-corpo">
      <div class="ficha-col" id="fBlocos"></div>
      <aside class="ficha-lat">
        <div class="card-lat">
          <h3 id="fLatTit"><i class="orn o1"></i> Módulos</h3>
          <div class="lista-nav" id="fNav"></div>
        </div>
        <div class="card-lat">
          <h3 style="background:#FFF6D6"><i class="orn o6" style="color:#111"></i> Leitura</h3>
          <div style="padding:11px 13px;font-size:11.5px;font-weight:700;line-height:1.5;color:var(--muted)">
            Módulo com dado abre sozinho.<br>Módulo vazio fica cinza e recolhido — não ocupa a tela, mas continua acessível.
          </div>
        </div>
      </aside>
    </div>
  </div>
</div>

<script>
const C={
  cliente:{cheia:'#E620FF',clara:'#FBE0FF'}, colab:{cheia:'#0091FF',clara:'#D1ECFF'},
  fornec:{cheia:'#3D5AFE',clara:'#DDE3FF'}, profis:{cheia:'#B026FF',clara:'#F2E7FE'},
  transp:{cheia:'#FF6B2C',clara:'#FFE4D6'}, obra:{cheia:'#FF2D95',clara:'#FFDDEE'},
  doc:{cheia:'#0091FF',clara:'#D1ECFF'}, end:{cheia:'#00E5FF',clara:'#CEF9FD'},
  cont:{cheia:'#FF6B2C',clara:'#FFE4D6'}, banco:{cheia:'#16A34A',clara:'#D2FEEB'},
  fiscal:{cheia:'#7C3DFF',clara:'#ECE8FD'}, comerc:{cheia:'#FACC15',clara:'#FFF6D6'},
  acesso:{cheia:'#5551FF',clara:'#D2D1FF'}, obs:{cheia:'#A8A29E',clara:'#F4F4F0'},
  social:{cheia:'#E620FF',clara:'#FBE0FF'}
};
const claro=k=>['end','comerc','obs'].indexOf(k)>=0;

/* ---------------------------------------------------------------------------
   MESMO SCHEMA DO CADASTRO — módulo é a unidade de tudo:
   do formulário, do filtro, da coluna da grade e do bloco da ficha.
   f: campos do módulo. Cada campo pode ser coluna (col), filtro (fil) ou ambos.
   --------------------------------------------------------------------------- */
const E={
 cliente:{nome:'Cliente',plural:'Clientes',cor:'cliente',orn:'o1',
  mods:[
   {id:'ident',cor:'cliente',orn:'o1',t:'Identificação',f:[
     {k:'nome',r:'Nome / Razão social',col:1,fil:'texto',forte:1},
     {k:'doc',r:'CPF / CNPJ',col:1,fil:'texto'},
     {k:'tipo',r:'Tipo de pessoa',fil:'sel',op:['Todos','Física','Jurídica']},
     {k:'cel',r:'Celular',col:1},{k:'email',r:'E-mail',fil:'texto'}]},
   {id:'doc',cor:'doc',orn:'o2',t:'Documentos',f:[
     {k:'rg',r:'RG'},{k:'nasc',r:'Nascimento',fil:'data'},{k:'civil',r:'Estado civil',fil:'sel',op:['Todos','Solteiro(a)','Casado(a)']},{k:'profissao',r:'Profissão',fil:'texto'}]},
   {id:'end',cor:'end',orn:'o4',t:'Endereço',f:[
     {k:'cidade',r:'Cidade',col:1,fil:'texto'},{k:'uf',r:'UF',fil:'sel',op:['Todas','SP','MG','RJ']},
     {k:'bairro',r:'Bairro',fil:'texto'},{k:'cep',r:'CEP'},{k:'log',r:'Logradouro'}]},
   {id:'comerc',cor:'comerc',orn:'o5',t:'Comercial',f:[
     {k:'origem',r:'Como conheceu',fil:'sel',op:['Todas','Indicação de profissional','Loja','Site','Instagram']},
     {k:'indicou',r:'Profissional que indicou',col:1,fil:'texto'},

function colunas(){
  const e=E[ent], out=[];

    const chave=m.id+'.'+c.k;
    if(c.col || colunasExtra[chave]) out.push({m:m,c:c});

}

  document.getElementById('seletor').innerHTML=Object.keys(E).map(x=>{
    const on=x===ent, c=C[E[x].cor];
    return '<div class="ent'+(on?' on':'')+'" style="'+(on?'background:'+c.cheia:'')+'" onclick="trocaEnt(\''+x+'\')"><span class="pt" style="background:'+c.cheia+'"></span>'+E[x].plural+'</div>';
  }).join('');

  document.getElementById('buscaGeral').placeholder='Buscar '+e.plural.toLowerCase()+' por nome, documento ou telefone…';
  const bn=document.getElementById('btnNovo');
  bn.style.background=cc.cheia; bn.textContent='+ Novo '+e.nome.toLowerCase();

  document.getElementById('modulos').innerHTML=e.mods.map(m=>{
    const n=nAtivos(m), c=C[m.cor];
    return '<div class="mod'+(modAberto===m.id?' on':'')+'" onclick="abreMod(\''+m.id+'\')" style="background:'+(modAberto===m.id?c.clara:'#fff')+'">'+
      '<span class="pt" style="background:'+c.cheia+'"></span>'+m.t+
      (n?'<span class="qt">'+n+'</span>':'')+'</div>';
  }).join('');

  const pf=document.getElementById('painelFiltro');
  if(modAberto){
    const m=e.mods.find(x=>x.id===modAberto), c=C[m.cor];
    pf.classList.add('aberto');
    document.getElementById('painelTopo').style.background=c.clara;
    document.getElementById('painelTopo').innerHTML='<span class="pt" style="width:13px;height:13px;border:2px solid #111;border-radius:4px;background:'+c.cheia+'"></span>Filtros de '+m.t+
      '<button class="x" onclick="abreMod(null)">Fechar</button>';
    document.getElementById('painelCorpo').style.background=c.clara;
    document.getElementById('painelCorpo').innerHTML=filtrosDoMod(m).map(c2=>{
      const id=m.id+'.'+c2.k, v=filtros[id]||'';
      if(c2.fil==='sel') return '<div><label>'+c2.r+'</label><select class="entrada" onchange="setF(\''+id+'\',this.value,\''+c2.r+'\',1)">'+c2.op.map(o=>'<option'+(o===v?' selected':'')+'>'+o+'</option>').join('')+'</select></div>';
      if(c2.fil==='data') return '<div><label>'+c2.r+' — período</label><div class="par-min"><input type="date" class="entrada" onchange="setF(\''+id+'\',this.value,\''+c2.r+'\')"><span style="font-weight:900">→</span><input type="date" class="entrada"></div></div>';
      if(c2.fil==='faixa')return '<div><label>'+c2.r+' — de / até</label><div class="par-min"><input class="entrada" placeholder="mín" onchange="setF(\''+id+'\',this.value,\''+c2.r+'\')"><span style="font-weight:900">→</span><input class="entrada" placeholder="máx"></div></div>';
      return '<div><label>'+c2.r+'</label><input class="entrada" value="'+v+'" placeholder="contém…" onchange="setF(\''+id+'\',this.value,\''+c2.r+'\')"></div>';
    }).join('');
  } else pf.classList.remove('aberto');

  document.getElementById('colunasCorpo').innerHTML=e.mods.map(m=>{
    const c=C[m.cor];
    return '<div style="border:2px solid #111;border-radius:9px;padding:10px;background:'+c.clara+'">'+
      '<div style="font-family:Archivo;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:6px">'+
      '<span style="width:11px;height:11px;border:2px solid #111;border-radius:4px;background:'+c.cheia+'"></span>'+m.t+'</div>'+
      m.f.map(c2=>{
        const id=m.id+'.'+c2.k, on=c2.col||colunasExtra[id];
        return '<div style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:5px;cursor:'+(c2.col?'not-allowed':'pointer')+';opacity:'+(c2.col?'.55':'1')+'" '+(c2.col?'':'onclick="toggleCol(\''+id+'\')"')+'>'+
          '<span style="width:16px;height:16px;border:2px solid #111;border-radius:5px;background:'+(on?'#16A34A':'#fff')+'"></span>'+c2.r+(c2.col?' · fixa':'')+'</div>';
      }).join('')+'</div>';
  }).join('');

  const at=Object.keys(filtros);
  document.getElementById('ativos').innerHTML = at.length
    ? at.map(k=>'<div class="pill" style="background:'+C[e.mods.find(m=>m.id===k.split('.')[0]).cor].clara+'"><b>'+filtros[k].r+':</b> '+filtros[k].v+'<span class="x" onclick="tiraF(\''+k+'\')">×</span></div>').join('')
      + '<button class="limpar" onclick="filtros={};pinta()">Limpar tudo</button>'
    : '';

  const cols=colunas(), regs=E[ent].regs;
  document.getElementById('contRes').innerHTML=regs.length+' <small>'+e.plural.toLowerCase()+' · '+cols.length+' colunas de '+e.mods.length+' módulos</small>';
  document.getElementById('cab').innerHTML='<tr>'+cols.map(x=>
    '<th><span class="tp" style="background:'+C[x.m.cor].cheia+'"></span>'+x.c.r+'</th>').join('')+'</tr>';
  document.getElementById('linhas').innerHTML=regs.map((r,i)=>'<tr onclick="abreFicha('+i+')">'+cols.map(x=>{
    const v=r[x.c.k];
    if(!v) return '<td><span class="vazio-cel">—</span></td>';
    if(x.c.grana) return '<td class="grana">'+(String(v).indexOf('R$')<0?'R$ '+v:v)+'</td>';
    if(x.c.forte) return '<td class="forte">'+v+'</td>';
    return '<td>'+v+'</td>';
  }).join('')+'</tr>').join('');
}
function trocaEnt(k){ ent=k; modAberto=null; filtros={}; colunasExtra={}; pinta(); }
function abreMod(id){ modAberto = (modAberto===id? null : id); document.getElementById('painelColunas').classList.remove('aberto'); pinta(); }
function alterna(){
  const p=document.getElementById('painelColunas');
  const abrir=!p.classList.contains('aberto');
  modAberto=null; pinta();
  p.classList.toggle('aberto',abrir);
}
function setF(id,v,r,sel){
  if(!v || (sel && /^(Tod[oa]s|Empresa atual)$/.test(v))) delete filtros[id]; else filtros[id]={v:v,r:r};
  pinta();
}
function tiraF(k){ delete filtros[k]; pinta(); }
function toggleCol(id){ colunasExtra[id]=!colunasExtra[id]; pinta(); }

/* ===================== ficha ===================== */
function abreFicha(i){
  regAtual=i;
  const e=E[ent], r=e.regs[i], cc=C[e.cor];
  document.getElementById('telaLista').classList.add('oculto');
  document.getElementById('telaFicha').classList.remove('oculto');

  const s=document.getElementById('fSelo'); s.style.background=cc.cheia; s.innerHTML='<i class="orn '+e.orn+'"></i>';
  const primeiro=e.mods[0].f.find(c=>c.forte)||e.mods[0].f[0];
  document.getElementById('fNome').textContent=r[primeiro.k]||'—';
  const seg=e.mods[0].f.filter(c=>c.k!==primeiro.k).slice(0,3).map(c=>r[c.k]).filter(Boolean);
  document.getElementById('fSub').textContent=e.nome+' · '+seg.join(' · ');

  document.getElementById('fKpis').innerHTML=e.kpis.map((k,idx)=>{
    const cores=[cc.clara,'#D2FEEB','#FFF6D6','#D1ECFF'];
    const v=r[k.k]||'—';
    return '<div class="kpi" style="background:'+cores[idx%4]+'"><div class="r">'+k.r+'</div><div class="v"'+(k.grana?' style="color:#16A34A"':'')+'>'+v+'</div></div>';
  }).join('');

  document.getElementById('fLatTit').innerHTML='<i class="orn '+e.orn+'" style="color:'+cc.cheia+'"></i> Módulos';
  document.getElementById('fLatTit').style.background=cc.clara;

  document.getElementById('fBlocos').innerHTML=e.mods.map(m=>{
    const c=C[m.cor], cheio=temDado(r,m);
    const preenchidos=m.f.filter(x=>r[x.k]&&String(r[x.k]).trim()!=='').length;
    const dir = cheio
      ? '<span class="contador">'+preenchidos+'/'+m.f.length+'</span><div class="lapis">'+LAPIS+'</div><div class="seta">'+CHEV+'</div>'
      : '<span class="tag">Vazio</span><button class="btn-preencher">+ Preencher</button><div class="seta">'+CHEV+'</div>';
    const corpo = cheio
      ? '<div class="dados">'+m.f.map(x=>{
          const v=r[x.k];
          return '<div class="dado"><div class="r">'+x.r+'</div><div class="v'+(v?(x.grana?' grana':''):' vazio')+'">'+(v?(x.grana&&String(v).indexOf('R$')<0?'R$ '+v:v):'não informado')+'</div></div>';
        }).join('')+'</div>'
      : '<div style="font-size:12.5px;font-weight:700;color:var(--muted)">Nenhum campo deste módulo foi preenchido. Campos: '+m.f.map(x=>x.r).join(' · ')+'</div>';
    return '<section class="bloco'+(cheio?' aberto':' oco')+'" data-bl="'+m.id+'">'+
      '<div class="bl-topo" onclick="this.parentElement.classList.toggle(\'aberto\')" style="background:'+c.cheia+';color:'+(claro(m.cor)?'#111':'#fff')+'">'+
        '<div class="selo"><i class="orn '+m.orn+'" style="color:'+c.cheia+'"></i></div>'+
        '<div class="bl-txt"><h2>'+m.t+'</h2><p>'+m.f.map(x=>x.r).slice(0,4).join(' · ')+'</p></div>'+
        '<div class="bl-dir">'+dir+'</div></div>'+
      '<div class="bl-corpo" style="background:'+c.clara+'">'+corpo+'</div></section>';
  }).join('');

  document.getElementById('fNav').innerHTML=e.mods.map(m=>{
    const cheio=temDado(r,m), n=m.f.filter(x=>r[x.k]&&String(r[x.k]).trim()!=='').length;
    return '<div class="item-nav'+(cheio?'':' oco')+'" onclick="vai(\''+m.id+'\')"><span class="pt" style="background:'+C[m.cor].cheia+'"></span>'+m.t+
      '<span class="st">'+(cheio?n+'/'+m.f.length:'vazio')+'</span></div>';
  }).join('');
  window.scrollTo({top:0,behavior:'smooth'});
}
function vai(id){ const b=document.querySelector('[data-bl="'+id+'"]'); b.classList.add('aberto'); b.scrollIntoView({behavior:'smooth',block:'center'}); }
function voltar(){ document.getElementById('telaFicha').classList.add('oculto'); document.getElementById('telaLista').classList.remove('oculto'); window.scrollTo({top:0}); }

pinta();
</script>
</body>
</html>
