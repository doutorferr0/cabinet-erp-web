packages:
  - '.'

allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  msw: false

# 7 dias em minutos (10080) — política de cooldown pós-supply-chain.
minimumReleaseAge: 10080

# Exceção pontual do reface fase 1: react-aria-components pinado EXATO em
# 1.20.0 (decisão pós-spike RAC). Versão exata + publisher Adobe react-spectrum.
#
# **Vence em 2026-08-07 às 15:26 UTC** — a HORA importa e já custou uma
# tentativa: o pacote foi publicado em 2026-07-31T15:26, e os 7 dias contam a
# partir dali, não da meia-noite do dia 7. Tirar a lista antes disso faz o
# `pnpm install` reprovar o lockfile inteiro com "within the minimumReleaseAge
# cutoff". Remover depois desse horário — e conferir rodando `pnpm install`.
minimumReleaseAgeExclude:
  - react-aria-components
  - react-aria
  - react-stately
  - '@react-aria/*'
  - '@react-stately/*'
  - '@react-types/*'
  - '@internationalized/*'
