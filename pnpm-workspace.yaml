packages:
  - '.'

allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  msw: false

# 7 dias em minutos (10080) — política de cooldown pós-supply-chain.
#
# Sem exceção nenhuma desde 2026-08-07: a lista temporária do reface fase 1
# (react-aria-components e o resto do guarda-chuva RAC, pinados em 1.20.0)
# existia só para atravessar os 7 dias do cooldown, contados de
# 2026-07-31T15:26 — a publicação do pacote, não a meia-noite do dia. Vencido o
# prazo, a exceção sai: cooldown com furo permanente não é cooldown.
minimumReleaseAge: 10080
