<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#111111" stroke-width="9" stroke-linejoin="miter" role="img" aria-label="Cabinet">
  <!--
    Cópia do `src/assets/marca/cabinet-mark-compact.svg` — a versão de 2 níveis,
    sem moldura, legível a 16px. É cópia e não import porque favicon é arquivo
    servido, não módulo: quem o lê é o browser antes de existir bundle.
    Mudou a marca? Mudar os DOIS. A única diferença permitida é a cor: aqui não
    há `currentColor` que resolva, então o traço é literal e vira por
    `prefers-color-scheme` para não sumir na aba escura.
  -->
  <style>
    @media (prefers-color-scheme: dark) { svg { stroke: #f5f5f5 } }
  </style>
  <path d="M13.85 93.77 L13.85 37.97 L50 7.67 L87.50 37.97 L87.50 93.77 Z"/>
  <path d="M33.35 74.27 L33.35 47.08 L50 33.11 L68.00 47.08 L68.00 74.27 Z"/>
</svg>
