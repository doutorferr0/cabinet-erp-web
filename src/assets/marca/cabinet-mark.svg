<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#16140F" stroke-linejoin="miter" stroke-linecap="butt">
  <!-- Marca Cabinet: duas casas concêntricas (pentágono de telhado reto + corpo quadrado), sem porta,
       sem preenchimento. A FORMA é fixa; a ESPESSURA é variável e quem a escolhe é `<Marca>`, por
       tamanho pedido — as larguras escritas aqui são as do degrau menor (≤28px), que é onde o
       desenho mais precisa de traço. Cópia servida em `public/marca.svg` e `public/favicon.svg`. -->
